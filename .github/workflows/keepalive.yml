name: Keep Supabase awake

# A free Supabase project is paused after about a week with low activity.
# This job asks the database for one row every 3 days.
# If the project is already paused (or the call fails), this job fails and GitHub emails you.
on:
  schedule:
    - cron: "41 5 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the Supabase REST API
        run: |
          curl --fail --silent --show-error --max-time 30 \
            "https://mrtgrwgmcjkwdatropwe.supabase.co/rest/v1/site_content?id=eq.main&select=id" \
            -H "apikey: sb_publishable_5xqInLWRx9xahCBD0ZE_Rg_KS7ZibXf" \
            -H "Authorization: Bearer sb_publishable_5xqInLWRx9xahCBD0ZE_Rg_KS7ZibXf"
          echo
