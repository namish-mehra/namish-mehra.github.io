name: Build and deploy to GitHub Pages

# Runs when code is pushed, when you press "Run workflow", and once a week.
# The weekly run rebuilds the site so the link-preview title, description and share image
# (written into index.html at build time) follow what you saved in /admin.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Public values only (the Supabase address and the publishable key are visible in any website).
      VITE_SUPABASE_URL: https://mrtgrwgmcjkwdatropwe.supabase.co
      VITE_SUPABASE_KEY: sb_publishable_5xqInLWRx9xahCBD0ZE_Rg_KS7ZibXf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
